<p>The researchers calculated the percentage change in size of each participant's brain. If a person's brain size increased, then this percentage change was positive; if brain size decreased, then this percentage change was negative. These data can be found in the file <a class="external" href="https://static-content2.zybooks.com/isi/data/chap9/Brain.txt" target="_blank">Brain</a><a href="" class="fn-knowl original" data-knowl="./knowl/fn-162-hidden.html" title="Footnote 10.1.2"><sup> 2 </sup></a>.</p>
