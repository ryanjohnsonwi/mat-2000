<p>The data for this investigation appear in a file called <a class="external" href="https://static-content2.zybooks.com/isi/data/chap9/Diets.txt" target="_blank">Diets</a><a href="" class="fn-knowl original" data-knowl="./knowl/fn-167-hidden.html" title="Footnote 10.2.2"><sup> 2 </sup></a>. Copy and paste the data into the <a class="external" href="https://static-content.zybooks.com/applets/2021/anovashuffle/AnovaShuffle.htm?hideExtras=2" target="_blank">Multiple Means applet</a><a href="" class="fn-knowl original" data-knowl="./knowl/fn-168-hidden.html" title="Footnote 10.2.3"><sup> 3 </sup></a>. (Recall that the response variable is change in BMI.) Press <dfn class="terminology">Use Data</dfn>, and the applet will produce dotplots and summary statistics.</p>
