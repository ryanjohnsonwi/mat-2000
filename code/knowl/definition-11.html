<p>A <dfn class="terminology">sampling distribution</dfn>  is the distribution of a statistic for all possible samples of size n randomly selected from the same population. By taking lots of samples, you can approximate this sampling distribution.</p></article><span class="incontext"><a href="section_3_2.html#definition-11" class="internal">in-context</a></span>
