<p>Two variables are <dfn class="terminology">associated</dfn> or related if the value of one variable gives you information about the value of the other variable. When comparing two groups this means that the proportions or means take different values in the two groups.</p></article><span class="incontext"><a href="section_5_2.html#definition-17" class="internal">in-context</a></span>
