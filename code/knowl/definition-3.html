<article class="definition definition-like"><h5 class="heading">
<span class="type">Definition</span><span class="space"> </span><span class="codenumber">2.1.13</span><span class="period">.</span>
</h5>
<p>A result is <dfn class="terminology">statistically significant</dfn> if it is unlikely to occur just by random chance. If our observed result appears to be consistent with the chance model, we say that the chance model is <dfn class="terminology">plausible</dfn> or believable.</p></article><span class="incontext"><a href="section-2.html#definition-3" class="internal">in-context</a></span>
