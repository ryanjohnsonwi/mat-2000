<p>The set of observational units on which we collect data is called the <dfn class="terminology">sample</dfn>. The number of observational units in the sample is the <dfn class="terminology">sample size</dfn>. A <dfn class="terminology">statistic</dfn> is a number summarizing the results in the sample.</p>
