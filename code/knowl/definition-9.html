<p>A sampling method is <dfn class="terminology">biased</dfn> if, when using that sampling method, statistics from different samples <em class="emphasis">consistently</em> overestimate or consistently underestimate the population parameter of interest.</p></article><span class="incontext"><a href="section_3_2.html#definition-9" class="internal">in-context</a></span>
