<p>The theory-based interval for a population mean (called a <dfn class="terminology">one-sample <em class="emphasis">t</em>-interval</dfn>) requires that the quantitative variable should have a symmetric distribution or you should have at least 20 observations and the sample distribution should not be strongly skewed.</p>
