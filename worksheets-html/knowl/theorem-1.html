<article class="theorem theorem-like"><h4 class="heading">
<span class="type">Theorem</span><span class="space"> </span><span class="codenumber">2.5.2</span><span class="period">.</span><span class="space"> </span><span class="title">Central Limit Theorem.</span>
</h4>
<div class="para">If the sample size (n) is large enough, the distribution of sample proportions will be bell-shaped (or normal), centered at the long-run proportion (<span class="process-math">\(\pi\)</span>), with a standard deviation of  <span class="process-math">\(\sqrt{\dfrac{\pi(1-\pi)}{n}}\)</span> .</div></article><span class="incontext"><a href="section_2_10.html#theorem-1" class="internal">in-context</a></span>
