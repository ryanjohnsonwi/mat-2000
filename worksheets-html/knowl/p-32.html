<div class="para">The <dfn class="terminology">probability</dfn> of an outcome is the long-run proportion of times an outcome from a random process occurs if the process is repeated indefinitely under identical conditions. A probability can be written as a decimal (0.3333), a fraction (1/3), or a percentage (33.33%).</div>
