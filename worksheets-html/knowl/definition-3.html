</h4>
<div class="para">A result is <dfn class="terminology">statistically significant</dfn> if it is unlikely to occur just by random chance. If our observed result appears to be consistent with the chance model, we say that the chance model is <dfn class="terminology">plausible</dfn> or believable.</div></article><span class="incontext"><a href="section_2_2.html#definition-3" class="internal">in-context</a></span>
