<p>A <dfn class="terminology">simple random</dfn> sample ensures that every sample of size <em class="emphasis">n</em> is equally likely to be the sample selected from the population. In particular, each observational unit has the same chance of being selected as every other observational unit.</p></article><span class="incontext"><a href="section_3_2.html#remark-7" class="internal">in-context</a></span>
