<p>Thus, we can <em class="emphasis">reject</em> the null hypothesis when the p-value is less than or equal to 0.05. Otherwise, when the p-value is greater than 0.05, we do not have strong enough evidence against the null hypothesis and so we consider the null value to be <em class="emphasis">plausible</em> for the parameter.</p>
