<p>If the sample size (n) is large enough, the distribution of sample proportions will be bell-shaped (or normal), centered at the long-run proportion (π), with a standard deviation of  <span class="process-math">\(\sqrt{\dfrac{\pi(1-\pi)}{n}}\)</span> .</p>
