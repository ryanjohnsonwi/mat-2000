<p>A <dfn class="terminology">confounding variable</dfn> is a variable that is related both to the explanatory and to the response variable in such a way that its effects on the response variable cannot be separated from the effects of the explanatory variable.</p></article><span class="incontext"><a href="section_5_2.html#definition-19" class="internal">in-context</a></span>
