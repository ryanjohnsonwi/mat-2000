<ul class="disc">

<span class="process-math">\(b\)</span> is the slope</div></li>
<li><div class="para">
<span class="process-math">\(x\)</span> is a value of the explanatory variable</div></li>
<li><div class="para">
<span class="process-math">\(\hat{y}\)</span> is the predicted value for the response variable</div></li>
</ul>
