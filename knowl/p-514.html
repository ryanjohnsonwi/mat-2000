<p>An approximate 2SD method for a 95% confidence interval for a population mean <span class="process-math">\(\mu\)</span> is  <span class="process-math">\(\overline{x} \pm 2 \times s / \sqrt{n} \)</span> . This method is valid when the sampling distribution follows a bell-shaped, symmetric distribution.</p>
