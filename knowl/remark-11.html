<p>If a sampling frame does not include every member of the population (e.g., last paragraph missing, nouns not listed), then we cannot claim to represent those segments in the population with our sample. An incomplete sampling frame can also lead to biased sampling.</p></article><span class="incontext"><a href="section_3_2.html#remark-11" class="internal">in-context</a></span>
