<h6 class="heading"><span class="type">Paragraph</span></h6>
<p>Recall that the <a class="external" href="https://static-content.zybooks.com/applets/2021/tbia/TBIA.html?hideExtras=1" target="_blank">Theory-Based Inference applet</a><a href="" class="fn-knowl original" data-knowl="./knowl/fn-122-hidden.html" title="Footnote 8.3.6"><sup> 6 </sup></a> can also produce confidence intervals for the parameter of interest.</p>
<ul class="disc">
<li><p>Go to the applet, check the <dfn class="terminology">Confidence interval</dfn> box and let the confidence level be 95%.</p></li>
<li><p>Press <dfn class="terminology">Calculate CI</dfn>.</p></li>
</ul>
