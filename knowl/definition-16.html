<article class="definition definition-like"><h4 class="heading">
<span class="type">Definition</span><span class="space"> </span><span class="codenumber">4.2.4</span><span class="period">.</span>
</h4>
<div class="para">An estimate of the standard deviation of a statistic, based on sample data, is called the <dfn class="terminology">standard error</dfn> (SE) of the statistic. In this case <span class="process-math">\(\sqrt{ \hat{p}(1-\hat{p}) / n}  \)</span> is the standard error of a sample proportion <span class="process-math">\(\hat{p}\text{.}\)</span>
</div></article><span class="incontext"><a href="section_4_4.html#definition-16" class="internal">in-context</a></span>
